# macos: this Mac's Endpoint Security events through packs/macos, each record kept in
# the lake, and each session (a terminal tab, an app, an agent, with all it
# ran) summarized five minutes at a time and judged, with packs/macos's brief
# in place of the judge's, which is written for a company's cloud. One
# config, one process.
#
#   tangent plugin compile --config tangent.yaml
#   tangent watch --config tangent.yaml       # a local model: JUDGE_URL, JUDGE_MODEL (packs/judge/README.md); haiku.yaml for Claude Haiku
#   tail -f alerts.ndjson                   # in another terminal
#
# The `macos` source is the whole capture (packs/macos/README.md). Tangent
# asks for your password once, through sudo, and starts the sensor and
# macOS's tcpdump as root: Endpoint Security sees no network, and tcpdump
# tags each packet with the process that sent it. It reads what you ask
# Claude Code from the transcripts under ~/.claude, as you. The terminal
# tangent runs in needs Full Disk Access (System Settings, Privacy &
# Security), restarted after the grant. Ctrl-C stops it all.
include:
  - ../../packs/macos/ingest.yaml             # plugin macos, on one worker
  - ../../packs/macos/judge.yaml              # the judge (and the enrich-ip and behavior-baseline packs it includes), reading sessions with the macos pack's brief and answer: pass, look or flag
  - ../../packs/macos/lake.yaml               # sink lake: every record as Parquet, the columns the second reviewer queries

sources:
  mac:
    type: macos
    # The sensor is this release's: tangent fetches it once per version and
    # checks its signature before each start. `sensor:` names one you built
    # from packs/macos/sensor (its README).

plugins:
  macos: { inputs: [mac] }                   # the sensor's events, and the connections and prompts joined to the same process tree
  macos_sessions: { inputs: [macos] }        # each session summarized
  macos_verdicts: { inputs: [judge] }        # what the judge said of a session, kept for the session's next summary

inference:
  judge: { inputs: [macos_sessions] }        # sessions, in place of the judge pack's own input

sinks:
  lake: { inputs: [macos] }                  # every record kept
  alerts: { inputs: [flagged, macos_verdicts] }   # the judge pack's, and a `look` or a `flag` a person has not been told of in this turn
