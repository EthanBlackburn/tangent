# A model on this machine reads every record; a plugin keeps what it flagged.
#
#   tangent run --config tangent.yaml
#   nc -w 1 localhost 9000 < events.ndjson
#   cat flagged.ndjson
#
# Any OpenAI-compatible local server works. One of:
#   mlx_lm.server --model mlx-community/GLM-4.7-Flash-4bit --port 8080     # Apple silicon
#   llama-server -hf unsloth/GLM-4.7-Flash-GGUF:Q4_K_M --port 8080         # llama.cpp, any OS
#   ollama serve, then in another shell ollama pull gpt-oss:20b  (and under `models` set model: gpt-oss:20b, url: http://localhost:11434/v1)
runtime:
  workers: 1
  plugins_path: plugins/

sources:
  events:
    type: tcp
    bind_address: 0.0.0.0:9000

models:
  glm:
    type: openai                    # the protocol, not the vendor
    url: http://localhost:8080/v1
    model: mlx-community/GLM-4.7-Flash-4bit
    concurrency: 8                  # mlx_lm.server batches the decodes of requests in flight
    timeout_ms: 120000              # time for a small local model to write ~20 verdicts

inference:
  judge:
    inputs: [events]
    model: glm                      # the entry under `models` above
    prompt_file: judge.md           # the reply lands on the record as judge
    batch_bytes: 4000               # ~20 of these events to a request
    max_tokens: 300                 # per record; a verdict is ~50 tokens, this bounds a runaway reply
    temperature: 0                  # the same verdict for the same record, run after run
    extra:
      chat_template_kwargs:
        enable_thinking: false      # mlx_lm and llama-server: answer in seconds, not minutes

plugins:
  flagged:                          # keeps judge.flag == true, and records the judge could not read
    inputs: [judge]
    module_type: rust
    path: flagged
    prebuilt: { repo: EthanBlackburn/tangent, workflow: .github/workflows/attest-packs.yml }   # the release's build of it: nothing to compile (tangent plugin fetch)

sinks:
  flagged_out:
    inputs: [flagged]
    type: file
    path: flagged.ndjson
    compression:
      type: none
