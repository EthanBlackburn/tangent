runtime:
  plugins_path: "plugins/"
plugins:
  rust:
    inputs: [network_input]
    module_type: rust
    path: .
    tests:
      - input: tests/input.json
        expected: tests/expected.json
sources:
  network_input:
    type: tcp
    bind_address: 0.0.0.0:9000
sinks:
  blackhole:
    inputs: [rust]
    type: blackhole
