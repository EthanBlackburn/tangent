# macos, reviewed: a second look at each alert, by a stronger model that can
# query the lake. Plugin macos_review holds a conversation with inference
# node `reviewer` for each alert it is handed, with the brief in review.md
# and the lake's records as a table to query, and sends the alert on with its
# review: malicious, benign or unresolved. Include it with lake.yaml and
# route plugin macos_verdicts to macos_review, and macos_review to where
# reviews go (examples/macos does).
inference:
  reviewer:                        # no edge reaches it: the plugin calls it
    backend: bedrock
    model: ${REVIEW_MODEL:-us.anthropic.claude-opus-5-5}
    aws:
      region: ${AWS_REGION:-us-west-2}
    prompt_file: review.md
    max_tokens: 8000               # a turn: its thinking, and a query or the report
    timeout_ms: 600000
    retries: 4
    concurrency: 1
    extra:
      thinking: { type: adaptive }
      output_config: { effort: medium }

plugins:
  macos_review:
    module_type: rust
    path: review
    prebuilt: { repo: EthanBlackburn/tangent, workflow: .github/workflows/attest-packs.yml }   # the release's component, its build attested (tangent plugin fetch)
    models: [reviewer]
    tables:
      lake: lake                   # table `lake` is what sink `lake` (lake.yaml) has written
    # An alert waits here until the lake has its records: the sink seals a
    # file five minutes after opening it, and up to a quarter more. Each alert
    # is a group of its own, and a grouped plugin has its own workers, so a
    # review holds up neither the capture nor the judge.
    group_by: [session.id, session.window]
    expire_after_ms: 400000
    config:
      model: reviewer
      table: lake
      days: 7                      # how far back from the alert the table reaches
      settle_seconds: 400          # the table ends this long after the alert's last event
      queries: 20                  # the most queries one review may make
