# macos, reviewed: a second look at each alert, by a stronger model that can
# query the lake. Plugin macos_review holds a conversation with inference
# node `reviewer` for each alert it is handed, with the brief in review.md
# and the lake's records as a table to query, and sends the alert on with its
# review: malicious, benign or unresolved. Include it with lake.yaml and
# route plugin macos_verdicts to macos_review, and macos_review to where
# reviews go (examples/macos does).
models:
  reviewer:
    type: bedrock
    model: ${REVIEW_MODEL:-us.anthropic.claude-sonnet-5-5}
    aws:
      region: ${AWS_REGION:-us-west-2}
    # Three reviews go at once (the plugin's `workers`), and a turn that
    # hangs holds up the alerts behind it: two minutes a try and three
    # tries, then the review is an error and the alert stands.
    timeout_ms: 120000
    retries: 2
    concurrency: 3

inference:
  reviewer:                        # it has no inputs: the plugin calls it
    model: reviewer
    prompt_file: review.md
    max_tokens: 8000               # a turn: its thinking, and a query or the report
    extra:
      thinking: { type: adaptive, display: summarized }   # a review keeps a summary of its thinking (`steps`)
      output_config: { effort: medium }

plugins:
  macos_review:
    module_type: rust
    path: review
    prebuilt: { repo: EthanBlackburn/tangent, workflow: .github/workflows/attest-packs.yml }   # the release's component, its build attested (tangent plugin fetch)
    inference: [reviewer]
    tables:
      lake: lake                   # table `lake` is what sink `lake` (lake.yaml) has written
    data: /                        # for read_file: the log's paths are absolute. The plugin reads only a file the log gives a reason to, never one kept as credentials or transcripts
    # An alert is reviewed ten seconds after the judge raised it: the lake
    # has a record once the sink has written it, sealed in a file or not.
    # Each alert is a group of its own, and a grouped plugin has its own
    # workers, so a review holds up neither the capture nor the judge.
    group_by: [session.id, session.window]
    workers: 3                     # three reviews at once
    attempts: 3                    # one that ended on a model or a lake that did not answer is made again, twice
    expire_after_ms: 10000
    config:
      model: reviewer
      table: lake
      days: 7                      # how far back from the alert the table reaches
      settle_seconds: 10           # the table ends this long after the alert's last event
      queries: 20                  # the most queries and file reads one review may make
      files: true                  # the model may read such a file as it is now; false: no file's text goes to it
