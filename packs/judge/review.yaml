# judge, reviewed: a second look at what the judge flagged, by a stronger
# model that can query the lake. Plugin review holds one conversation with
# inference node `reviewer` for each actor's alerts, with the brief in
# review.md and the lake's records as a table to query, and sends each alert
# on with its review: malicious, benign or unresolved. Include it beside
# ingest.yaml (or hosted.yaml) in a config with a sink `lake`, and route
# plugin flagged to review, and review to where reviews go
# (examples/cloud-infra/review.yaml does).
models:
  reviewer:
    type: bedrock
    model: ${REVIEW_MODEL:-us.anthropic.claude-sonnet-5-5}
    aws:
      region: ${AWS_REGION:-us-west-2}
    # Reviews go one at a time, so a turn that hangs holds up every review
    # behind it: two minutes a try and three tries, then the review is an
    # error and the alerts stand.
    timeout_ms: 120000
    retries: 2
    concurrency: 1

inference:
  reviewer:                        # it has no inputs: the plugin calls it
    model: reviewer
    prompt_file: review.md
    max_tokens: 8000               # a turn: its thinking, and a query or the report
    extra:
      thinking: { type: adaptive }
      output_config: { effort: low }

plugins:
  review:
    module_type: rust
    path: review
    prebuilt: { repo: EthanBlackburn/tangent, workflow: .github/workflows/attest-packs.yml }   # the release's component, its build attested (tangent plugin fetch)
    inference: [reviewer]
    tables:
      lake: lake                   # table `lake` is what sink `lake` has written
    # An actor's alerts a minute apart or less wait here together and are
    # reviewed as one, five minutes after the first at the latest: alerts
    # that keep coming do not keep their review waiting. They wait for no file: the lake has a record once the
    # sink has written it, sealed or not. A grouped plugin has its own
    # workers, so a review holds up neither ingest nor the judge.
    group_by: [_norm.org, _norm.actor]
    expire_after_ms: 60000
    max_age_ms: 300000
    config:
      model: reviewer
      table: lake
      days: 30                     # how far back from the alerts the table reaches
      settle_seconds: 0            # the table ends this long after the last alert
      queries: 20                  # the most queries one review may make
