# judge, reviewed, with no model named: the judge for a hosted model
# (hosted.yaml), the reviewer (review.yaml) without Claude on Bedrock's
# settings, the lake the reviewer reads, and where the reviews go. Your
# config names the two models; anthropic.yaml and openrouter.yaml are this
# with a measured pair. Route each pack's plugin to lake, baseline_builder
# and baseline_renderer:
#
#   include: [pack:judge/reviewed, pack:cloudtrail]
#   inference:
#     judge: { url: ..., model: ..., api_key: ... }
#     reviewer: { url: ..., model: ..., api_key: ... }
#   dag:
#     - from: cloudtrail
#       to: [lake, baseline_builder, baseline_renderer]
#
# A null here removes what review.yaml set, as hosted.yaml's do ingest.yaml's.
include:
  - hosted.yaml
  - review.yaml

inference:
  reviewer:
    backend: ~
    model: ~
    aws: ~
    extra: ~

sinks:
  lake:                          # every finished record, kept: what the reviewer queries
    type: rolling_file
    path: lake/logs/%Y/%m/%d/%H
    wal_path: lake/wal
    max_file_age_seconds: 3600
    compression: { type: zstd, level: 3 }
    encoding:
      type: parquet
      record_column: record      # each record whole, for the fields the schema leaves out
      schema:
        ts: timestamp
        source: string
        _norm: { org: string, actor: string, kind: string, ip: string }
  reviews:
    type: file
    path: reviews.ndjson
    compression:
      type: none

dag:
  - from: flagged                # each alert, also to the reviewer
    to: [review]
  - from: review
    to: [reviews]
