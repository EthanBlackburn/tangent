{{header}}
# The whole pipeline is in this file. Each node names the nodes it takes
# records from, as `inputs`:
#
#   {{flow}}
#     -> baseline_builder                           each record learned
#     -> lake                                       and kept
#     -> baseline_renderer -> judge -> fresh -> verdicts
#                                      fresh -> flagged -> alerts
#                                               flagged -> review -> reviews
#
# judge.md and review.md, beside this file, are what the two models are told.

sources:
{{sources}}

plugins:
  # A plugin for each source: its records normalized, trimmed and enriched,
  # with what profile.yaml says of whoever acted. `prebuilt` is the release a
  # plugin comes from, compiled: tangent fetches it once for each of its
  # versions, and keeps it only if the attestation of its build checks out.
{{packs}}

  # Each actor's history. The builder folds every record into state.sqlite.
  # The renderer holds an actor's records as a group and puts `_baseline` on
  # them: what was known of the actor before the first of them.
  baseline_builder:
    inputs: [{{inputs}}]
    module_type: rust
    prebuilt: { repo: EthanBlackburn/tangent, workflow: .github/workflows/attest-packs.yml }
    state_namespace: baseline
  baseline_renderer:
    inputs: [{{inputs}}]
    module_type: rust
    prebuilt: { repo: EthanBlackburn/tangent, workflow: .github/workflows/attest-packs.yml }
    state_namespace: baseline
    drop_on_error: false         # no `_baseline` rather than no record
    group_by: [_norm.org, _norm.actor]
    max_events: 30               # a group goes to the judge at thirty records,
    max_age_ms: 3600000          # or an hour after its first,
    expire_after_ms: 3600000     # or after an hour's quiet
    history: 10                  # with the actor's latest ten again, as `_context`

  # After the judge: fresh drops the records it was shown again as context,
  # and flagged keeps the ones it flagged.
  fresh:
    inputs: [judge]
    module_type: rust
    prebuilt: { repo: EthanBlackburn/tangent, workflow: .github/workflows/attest-packs.yml }
  flagged:
    inputs: [fresh]
    module_type: rust
    prebuilt: { repo: EthanBlackburn/tangent, workflow: .github/workflows/attest-packs.yml }

  # An actor's alerts wait here together until the lake has their records, a
  # little over an hour, and are reviewed in one conversation with the
  # reviewer, which can query the lake.
  review:
    inputs: [flagged]
    module_type: rust
    prebuilt: { repo: EthanBlackburn/tangent, workflow: .github/workflows/attest-packs.yml }
    inference: [reviewer]
    tables:
      lake: lake                 # table `lake` is what sink `lake` has written
    group_by: [_norm.org, _norm.actor]
    expire_after_ms: 4000000
    config:
      model: reviewer
      table: lake
      days: 30                   # how far back from the alerts the table reaches
      settle_seconds: 0          # the table ends this long after the last alert
      queries: 20                # the most queries one review may make

# The models: where each is served, and how hard it may be asked. The judge
# and the reviewer, under `inference`, each name theirs.
models:
{{models}}

inference:
  # The judge reads every record, an actor's group in one request, and
  # answers each: flagged or not, and why.
  judge:
    inputs: [baseline_renderer]
    model: {{judge_entry}}
{{judge}}
    prompt_file: judge.md
    schema_file: judge.schema.json   # the shape its answer is held to
    group_by: [_norm.org, _norm.actor]
    batch_bytes: {{batch_bytes}}
    # How the records are written for the model: a logfmt line each, about
    # half the tokens of JSON. The fields in `keep` are on every line, and
    # the rest, which an actor's records share, are written once.
    encoding:
      type: logfmt
      keep: [_context, _norm.actor, _norm.kind, _norm.target, _norm.dest, _facts.principal, _facts.watch, _facts.sensitive_target, _facts.key_known_network, _facts.ip.tor, _facts.ip.vpn]
      # For each source: the fields that name who acted and when, and the
      # fields of its own that are on every line.
      sources:
{{rows}}

  # The reviewer settles what the judge flagged. It has no inputs: plugin
  # review holds the conversation with it.
  reviewer:
    model: {{reviewer_entry}}
{{reviewer}}
    prompt_file: review.md
    max_tokens: 8000             # a turn: its thinking, and a query or the report

sinks:
  # Every record, kept as Parquet, a directory an hour: what the reviewer
  # queries, and `tangent query` reads. Delete old hours to trim it.
  lake:
    inputs: [{{inputs}}]
    type: rolling_file
    path: lake/logs/%Y/%m/%d/%H
    wal_path: lake/wal
    max_file_age_seconds: 3600
    compression: { type: zstd, level: 3 }
    encoding:
      type: parquet
      record_column: record      # each record whole, for the fields the schema leaves out
      schema:
        ts: timestamp
        source: string
        _norm: { org: string, actor: string, kind: string, ip: string }
  verdicts:                      # every record the judge answered, with its answer
    inputs: [fresh]
    type: file
    path: verdicts.ndjson
    compression: { type: none }
  alerts:                        # the ones it flagged
    inputs: [flagged]
    type: file
    path: alerts.ndjson
    compression: { type: none }
  reviews:                       # each alert with its review: malicious, benign or unresolved
    inputs: [review]
    type: file
    path: reviews.ndjson
    compression: { type: none }

# Files beside this one, none shipped. Without one, its facts are left out,
# with a warning. profile.yaml is your company, what no log says:
# https://github.com/EthanBlackburn/tangent/blob/main/packs/README.md#the-profile
# The data/ files name each address's country, owner, hosting, Tor and VPN:
# https://github.com/EthanBlackburn/tangent/blob/main/examples/enrich/README.md#data
enrichment_tables:
  profile: { type: document, path: profile.yaml }
  geo: { type: mmdb, path: data/GeoLite2-Country.mmdb }
  asn: { type: mmdb, path: data/GeoLite2-ASN.mmdb }
  networks: { type: cidr, path: data/networks.csv }

runtime:
  state:                         # where the builder keeps each actor's history; its keys never expire
    backend: sqlite
    path: state.sqlite
    default_ttl_ms: 0
    max_ttl_ms: 0
