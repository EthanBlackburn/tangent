# tangent.yaml, written by `tangent init`. Check the line marked EDIT, then:
#
#   tangent replay --config tangent.yaml --from 1d
#
# That reads the last day of your AWS account's CloudTrail (Event history,
# every region, up to 90 days back) and has each actor's records
# judged by Claude Haiku 5.5, and what it flags reviewed by Claude Sonnet 5.5 (Anthropic's API).
# What was flagged is in alerts.ndjson, each alert with its review in
# reviews.ndjson, and every verdict in verdicts.ndjson. `tangent config
# --config tangent.yaml` prints it merged with the packs. `tangent init
# --model` writes this file for another model: anthropic, bedrock,
# openrouter, openai or local.

# The AWS profile (~/.aws/config) that reads CloudTrail:
# $AWS_PROFILE, or default when it is unset, as the aws CLI picks one.
x-profile: &profile "${AWS_PROFILE:-default}"    # EDIT to name another profile

include:
  - pack:judge/anthropic       # Claude Haiku 5.5 judges, Claude Sonnet 5.5 reviews; the key is $ANTHROPIC_API_KEY, from console.anthropic.com
  - pack:cloudtrail            # plugin cloudtrail: CloudTrail into finished records

sources:
  aws_audit:
    type: cloudtrail
    profile: *profile
    region: us-east-1          # for looking up its credentials; replay reads every region

# Files beside this one, none shipped. Without one, its facts are left out,
# with a warning. profile.yaml is your company, what no log says:
# https://github.com/EthanBlackburn/tangent/blob/main/packs/README.md#the-profile
# The data/ files name each address's country, owner, hosting, Tor and VPN:
# https://github.com/EthanBlackburn/tangent/blob/main/examples/enrich/README.md#data
enrichment_tables:
  profile: { type: document, path: profile.yaml }
  geo: { type: mmdb, path: data/GeoLite2-Country.mmdb }
  asn: { type: mmdb, path: data/GeoLite2-ASN.mmdb }
  networks: { type: cidr, path: data/networks.csv }

# What this file wires: the plugin takes the source, and the judge pack's
# lake, builder and renderer take the plugin's records. The pack goes on
# from there (each actor's history, the judge, the reviewer, then
# alerts.ndjson, reviews.ndjson and verdicts.ndjson).
plugins:
  cloudtrail: { inputs: [aws_audit] }
  baseline_builder: { inputs: [cloudtrail] }     # each record learned
  baseline_renderer: { inputs: [cloudtrail] }    # and judged
sinks:
  lake: { inputs: [cloudtrail] }                 # and kept, for the reviewer to query
